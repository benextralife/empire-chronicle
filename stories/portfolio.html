<head>
<meta charset="UTF-8">

<title>Starfield Pluck — Series Portfolio</title>
<style>
  :root { --bg:#0b0d17; --card:#131627; --accent:#7c5cfc; --gold:#fbbf24; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  header { background:radial-gradient(ellipse at top,#1e1b4b 0%,#0b0d17 70%); padding:60px 24px 40px; text-align:center; border-bottom:1px solid #1e293b; }
  header h1 { font-size:2.4rem; color:var(--gold); margin:0 0 8px; letter-spacing:.15em; }
  header p { color:var(--muted); margin:4px 0; }
  .stats { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .stat { background:var(--card); border:1px solid #1e293b; border-radius:12px; padding:14px 22px; min-width:140px; }
  .stat .n { font-size:2rem; color:var(--accent); font-weight:700; }
  .stat .l { font-size:.8rem; color:var(--muted); margin-top:4px; }
  .search { text-align:center; padding:24px; }
  .search input { background:var(--card); border:1px solid #1e293b; color:var(--text); padding:10px 16px; border-radius:999px; width:380px; max-width:90%; font-size:.95rem; outline:none; }
  .search input:focus { border-color:var(--accent); }
  .toc { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px 24px; }
  .toc a { color:var(--text); background:var(--card); border:1px solid #1e293b; padding:6px 14px; border-radius:999px; text-decoration:none; font-size:.85rem; }
  .toc a:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; padding:24px; max-width:1400px; margin:0 auto; }
  .card { background:var(--card); border:1px solid #1e293b; border-radius:12px; padding:18px; transition:transform .15s,border-color .15s; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .card h3 { margin:0 0 6px; font-size:1.05rem; color:var(--gold); }
  .card .meta { font-size:.8rem; color:var(--muted); margin-bottom:8px; }
  .card .prompt { font-size:.78rem; color:#a5b4fc; background:#1e1b4b; padding:8px; border-radius:6px; border-left:3px solid var(--accent); margin-top:8px; }
  footer { text-align:center; padding:40px; color:var(--muted); font-size:.85rem; }
</style>

</header>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
function groupLetter(s){ const l=s[0].toUpperCase(); return /[A-Z]/.test(l)?l:'#'; }
function renderToc(){
  const groups=new Map();
  DATA.forEach(s=>{ const k=groupLetter(s.name); groups.set(k,(groups.get(k)||0)+1); });
  document.getElementById('toc').innerHTML=Array.from(groups.keys()).sort().map(k=>'<a href="#'+k+'">'+k+' ('+groups.get(k)+')</a>').join('');
}
function renderGrid(list){
  document.getElementById('grid').innerHTML=list.map(s=>'<div class="card"><h3>'+s.name+'</h3><div class="meta">'+s.chapters+' chapters · '+s.words.toLocaleString()+' words</div><div class="prompt">'+(s.cover_prompt||'').replace(/</g,'&lt;')+'</div></div>').join('');
}
function filter(){ const q=document.getElementById('q').value.toLowerCase(); if(!q){renderGrid(DATA);return;} renderGrid(DATA.filter(s=>s.name.toLowerCase().includes(q)||s.dir.includes(q))); }
renderToc(); renderGrid(DATA);
document.getElementById('sSeries').textContent=DATA.length;
document.getElementById('sChapters').textContent=DATA.reduce((a,s)=>a+s.chapters,0);
document.getElementById('sWords').textContent=DATA.reduce((a,s)=>a+s.words,0).toLocaleString();
</script>
