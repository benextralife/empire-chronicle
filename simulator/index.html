<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Kingdom of Ashworth — Live Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #1e293b, #334155);
  padding: 16px 24px;
  border-bottom: 2px solid #475569;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
header h1 { font-size: 1.4rem; color: #60a5fa; }
.tick-info { font-size: 0.85rem; color: #94a3b8; }
.lang-btn {
  background: #334155;
  border: 1px solid #475569;
  color: #e2e8f0;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: all 0.15s;
  user-select: none;
}
.lang-btn:hover { background: #475569; transform: translateY(-1px); }
.lang-btn.active { background: #2563eb; border-color: #3b82f6; }

.controls {
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.btn {
  background: #334155;
  border: 1px solid #475569;
  color: #e2e8f0;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: all 0.15s;
  user-select: none;
}
.btn:hover { background: #475569; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.active { background: #2563eb; border-color: #3b82f6; }

.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px;
  max-width: 1400px;
  margin: 0 auto;
}
@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; }
}
.panel {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 14px;
}
.panel h2 {
  font-size: 1rem;
  color: #60a5fa;
  margin-bottom: 10px;
  border-bottom: 1px solid #334155;
  padding-bottom: 6px;
}

/* MAP */
.map-section {
  grid-column: span 2;
}
@media (max-width: 900px) {
  .map-section { grid-column: span 1; }
}
.map-container {
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 50vh;
  background: #0f172a;
  border: 2px solid #334155;
  border-radius: 8px;
  overflow: hidden;
}
.map-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}
.map-legend {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 0.7rem;
  margin-top: 6px;
}
.map-legend-item { display: flex; align-items: center; gap: 3px; }
.map-legend-color { width: 10px; height: 10px; border-radius: 2px; }

/* RESOURCES */
.resource-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.resource-item {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 0.78rem;
}
.resource-label { color: #94a3b8; }
.resource-value { font-size: 1.1rem; font-weight: bold; color: #34d399; }
.chart-bar {
  height: 6px;
  background: #334155;
  border-radius: 3px;
  overflow: hidden;
  margin-top: 3px;
}
.chart-fill {
  height: 100%;
  background: #34d399;
  border-radius: 3px;
  transition: width 0.5s;
}

/* AGENTS */
.agent-card {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 0.82rem;
}
.agent-card.dead { opacity: 0.5; border-style: dashed; }
.agent-card.actor { border-color: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,0.2); }
.agent-name { font-weight: bold; color: #fbbf24; }
.agent-meta { color: #94a3b8; font-size: 0.75rem; }
.agent-action { color: #a5b4fc; margin-top: 2px; font-size: 0.78rem; }
.agent-title { color: #fbbf24; font-size: 0.7rem; font-style: italic; }

.faction-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.faction-tag {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 0.75rem;
}
.faction-name { color: #fbbf24; }
.faction-count { color: #64748b; }

/* EVENTS */
.event-log {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 8px 10px;
  max-height: 380px;
  overflow-y: auto;
  font-size: 0.78rem;
}
.event-item { padding: 5px 0; border-bottom: 1px solid #1e293b; }
.event-item:last-child { border-bottom: none; }
.event-time { color: #64748b; }
.event-type { color: #fbbf24; }
.tab-bar { display: flex; gap: 4px; margin-bottom: 8px; }
.tab-btn {
  background: transparent;
  border: 1px solid #334155;
  color: #94a3b8;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.75rem;
}
.tab-btn.active { background: #2563eb; color: white; border-color: #3b82f6; }

/* ARCHIVES */
.archive-timeline {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.archive-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #475569; cursor: pointer; transition: all 0.2s;
}
.archive-dot:hover { background: #60a5fa; transform: scale(1.3); }
.archive-dot.has-data { background: #34d399; }
.archive-dot.current { background: #fbbf24; border: 1px solid #f59e0b; }

/* TOOLTIP */
.tooltip {
  position: fixed;
  background: #1e293b;
  border: 1px solid #475569;
  color: #e2e8f0;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  pointer-events: none;
  z-index: 100;
  display: none;
  max-width: 200px;
}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="pageTitle">🤖 Kingdom of Ashworth — Live Simulator</h1>
    <span class="tick-info" id="tickInfo">Tick: 0 | Day 1 | 06:00</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="lang-btn active" id="langEn">EN</button>
    <button class="lang-btn" id="langZh">中文</button>
  </div>
</header>

<div class="controls">
  <button class="btn" id="speedBtn">⚡ Speed: 1x</button>
  <button class="btn" id="eventBtn">📜 Event</button>
  <span style="color:#64748b;font-size:0.8rem;margin-left:8px;" id="autoLabel">Auto-evolve: 10s</span>
  <span style="color:#64748b;font-size:0.8rem;" id="popLabel">👥 120</span>
</div>

<div class="main-grid">
  <!-- MAP — top of page, big -->
  <div class="panel map-section">
    <h2 id="facTitle">🏛 Factions & Territory</h2>
    <div class="map-container">
      <canvas class="map-canvas" id="mapCanvas"></canvas>
    </div>
    <div class="map-legend" id="mapLegend"></div>
    <div style="margin-top:10px;">
      <div style="font-size:0.75rem;color:#94a3b8;" id="archiveTitle">📚 Archives</div>
      <div class="archive-timeline" id="archiveTimeline"></div>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="panel">
    <h2 id="resTitle">💰 Resources</h2>
    <div class="resource-grid" id="resourceGrid"></div>
    <h2 id="ecoTitle" style="margin-top:14px;">📈 Economy</h2>
    <div id="economyInfo" style="font-size:0.8rem;color:#94a3b8;"></div>
    <div id="agentStats" style="margin-top:8px;font-size:0.78rem;color:#94a3b8;"></div>
  </div>

  <!-- CITIZENS — full width below map -->
  <div class="panel" style="grid-column: span 2;">
    <h2 id="agtTitle">👥 Citizens</h2>
    <div id="actorList" style="margin-bottom:6px;"></div>
    <div id="agentList"></div>
  </div>

  <!-- EVENTS -->
  <div class="panel">
    <h2 id="evtTitle">📜 Events</h2>
    <div class="tab-bar">
      <button class="tab-btn active" id="tabLive">Live</button>
      <button class="tab-btn" id="tabPast">Past</button>
    </div>
    <div id="eventDisplay">
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ============================================================
// CONSTITUTION + WORLD BIBLE
// ============================================================
const CONSTITUTION = {
  I: 'Every agent has immutable name, mutable age/health/wealth, one faction, five personality dimensions, four skills, 20-step memory. Death at health≤0, old age, or mass-mortality event. Birth when population < 8.',
  II: 'Four factions: Crown (blue, policy), Merchant Guild (green, trade), Academy (purple, research), Shadow Market (red, illicit). Compete for 8x8 territory.',
  III: 'Six resources: Money, Food, Materials, Energy, Influence, Population. Bounded random walk per tick, floor 1000.',
  IV: 'GDP = faction productivity sum. Inflation ±0.5%/tick, clamped [-2%, +15%]. Market cycles: stable → growing → shrinking → volatile.',
  V: 'Events generated 35% per tick, weighted severity 1-4.',
  VI: '8x8 grid territory. Each zone has owner (faction id or null) and contested flag. Click map to claim/release.',
  VII: '1 tick = 10 sim minutes. 6 ticks = 1 hour. 24 hours = 1 day. Agent age +0.007y/tick.',
  VIII: 'Trust ↑ cooperation. Distrust ↑ conflict. Betrayal = long-term hostility. Shared goals = alliances.',
  IX: 'Visitors may click territory cells, trigger events, pause/speed/reset. Player actions logged.',
  X: 'State persisted to localStorage every tick. Archives every 6 ticks. No external calls.'
};
const WORLD_BIBLE = {
  name: 'Kingdom of Ashworth',
  zones: '8x8 grid, 64 total',
  keyLocations: [
    { name: 'Ashworth Citadel', place: '[3,3]-[4,4]', faction: 'gov', desc: 'Seat of power' },
    { name: 'Academy Spire', place: 'north [1,2]', faction: 'research', desc: 'Research hub' },
    { name: 'Guild Docks', place: 'west [3,0]', faction: 'corp', desc: 'Trade center' },
    { name: 'Factory Row', place: 'east [4,7]', faction: 'corp', desc: 'Industrial zone' },
    { name: 'Bazaar of Whispers', place: 'south [6,4]', faction: 'black', desc: 'Black market HQ' }
  ],
  history: [
    'Era 1: Founding — Four founders establish neutral research+trade nation.',
    'Era 2: Expansion — Trade Wars between Crown and Merchant Guild.',
    'Era 3: Industrial Age — Factory Row transforms eastern zones.',
    'Era 4: Modern — Uneasy alliance. Public opinion shifts with policy.'
  ],
  creed: '"Knowledge is the light, trade is the blood, power is the shield, shadow is the necessary dark."'
};

// ============================================================
// ENGINE
// ============================================================
const MAP_SIZE = 8;
const STORAGE_KEY = 'ai_country_state_v7';
const LANG_KEY = 'ai_country_lang_v7';
const ARCHIVE_KEY = 'ai_country_archives_v3';

const factionIds = ['gov', 'corp', 'research', 'black'];
const factionColors = { gov: '#3b82f6', corp: '#10b981', research: '#8b5cf6', black: '#ef4444' };
const factionNames_EN = { gov: 'Crown', corp: 'Merchant Guild', research: 'Academy', black: 'Shadow Market' };
const factionNames_ZH = { gov: '王室', corp: '商會', research: '學院', black: '暗市' };

const NAMES_EN = ['Aria','Bolt','Cipher','Drift','Echo','Flux','Glitch','Haven','Ion','Jade','Kai','Lumen','Mist','Nexus','Oracle','Pixel','Quill','Riven','Spark','Tide','Umbra','Vex','Wisp','Xen','Yield','Zen'];
const NAMES_ZH = ['雲','風','影','星','河','光','塵','焰','雷','玲','霄','辰','瑤','墨','楓','月','白','夜','竹','霜','銳','烽','雪','焰'];

const i18n = {
  en: {
    pageTitle: '🤖 Kingdom of Ashworth — Live Simulator',
    tickInfo: (t,d,tm) => `Tick: ${t} | Day ${d} | ${tm}`,
    resTitle: '💰 Resources', facTitle: '🏛 Factions & Territory', ecoTitle: '📈 Economy',
    agtTitle: '👥 Citizens', evtTitle: '📜 Events', archiveTitle: '📚 Archives',
    speed: (s) => `⚡ Speed: ${s}x`, autoLabel: 'Auto-evolve: 10s', trigger: '📜 Event',
    gdp: 'GDP', inflation: 'Inflation', unemployment: 'Unemployment', market: 'Market',
    mood: 'Mood', wealth: 'Wealth', age: 'Age', health: 'Health',
    dead: 'Dead', stable: 'stable', growing: 'growing', shrinking: 'shrinking', volatile: 'volatile',
    tabLive: 'Live', tabPast: 'Past',
    resources: { money: '💰 Money', food: '🌾 Food', materials: '🔩 Materials', energy: '⚡ Energy', influence: '📢 Influence', population: '👥 Population' },
    moods: ['happy','neutral','anxious','focused','excited'],
    actions: ['worked at factory','conducted research','negotiated a deal','socialized at market','attended faction meeting','traded resources','rested at home','explored new territory','helped a colleague','reported to supervisor','produced goods','studied engineering','mediated dispute','recruited new member','patrolled border','built infrastructure','delivered supplies','organized festival','wrote algorithms'],
    events: [
      { icon: '⚡', msg: 'Power grid fluctuation in District 7', w: 1 },
      { icon: '🤝', msg: 'Faction trade agreement signed', w: 2 },
      { icon: '🔥', msg: 'Market surge in tech sector', w: 2 },
      { icon: '🕵️', msg: 'Black market activity detected', w: 1 },
      { icon: '📢', msg: 'New policy announced by the Crown', w: 3 },
      { icon: '🔬', msg: 'Research breakthrough published', w: 2 },
      { icon: '🌾', msg: 'Food production increased', w: 1 },
      { icon: '⚔️', msg: 'Territory dispute between factions', w: 2 },
      { icon: '💬', msg: 'Public opinion shifting', w: 1 },
      { icon: '🏗️', msg: 'New construction project started', w: 2 },
      { icon: '👶', msg: 'A new citizen joined Ashworth', w: 2 },
      { icon: '🚨', msg: 'Disease outbreak warning', w: 2 },
      { icon: '☠️', msg: 'A citizen passed away', w: 2 },
      { icon: '⚰️', msg: 'Mass mortality event struck Ashworth', w: 3 },
      { icon: '🏥', msg: 'Hospital capacity expanded', w: 1 },
      { icon: '📣', msg: 'Birth rate rising in urban zones', w: 1 },
      { icon: '🧹', msg: 'Faction assigned cleanup crew', w: 1 },
      { icon: '🦠', msg: 'Epidemic spreading to 2 zones', w: 2 },
    ]
  },
  zh: {
    pageTitle: '🤖 雅士王國 — 即時模擬器',
    tickInfo: (t,d,tm) => `Tick ${t} | 第${d}天 | ${tm}`,
    resTitle: '💰 資源', facTitle: '🏛 派系與領土', ecoTitle: '📈 經濟',
    agtTitle: '👥 國民', evtTitle: '📜 事件', archiveTitle: '📚 歷史存檔',
    speed: (s) => `⚡ 速度: ${s}x`, autoLabel: '每 10 秒自動演化', trigger: '📜 觸發',
    gdp: '國內總產值', inflation: '通脹', unemployment: '失業率', market: '市場',
    mood: '心情', wealth: '財富', age: '年齡', health: '健康',
    dead: '已故', stable: '平穩', growing: '成長', shrinking: '收縮', volatile: '波動',
    tabLive: '即時', tabPast: '歷史',
    resources: { money: '💰 金錢', food: '🌾 糧食', materials: '🔩 物資', energy: '⚡ 能源', influence: '📢 影響力', population: '👥 人口' },
    moods: ['愉快','平靜','焦慮','專注','興奮'],
    actions: ['在工廠工作','執行研究','談判交易','逛市場','參加派系會議','交易資源','在家休息','探索新領土','幫助同事','向主管回報','生產商品','學習工程技術','調解爭端','招募新成員','巡邏邊境','建設基礎設施','運送補給','舉辦慶典','編寫程式'],
    events: [
      { icon: '⚡', msg: '第 7 區電網波動', w: 1 },
      { icon: '🤝', msg: '派系貿易協定簽署', w: 2 },
      { icon: '🔥', msg: '科技板塊市場飆漲', w: 2 },
      { icon: '🕵️', msg: '偵測到黑市活動', w: 1 },
      { icon: '📢', msg: '王室發布新政策', w: 3 },
      { icon: '🔬', msg: '學院研究突破發表', w: 2 },
      { icon: '🌾', msg: '糧食產量提升', w: 1 },
      { icon: '⚔️', msg: '派系領土糾紛', w: 2 },
      { icon: '💬', msg: '輿論風向轉變', w: 1 },
      { icon: '🏗️', msg: '新建設項目啟動', w: 2 },
      { icon: '👶', msg: '一名新國民誕生於雅士王國', w: 2 },
      { icon: '🚨', msg: '傳染病警報響起', w: 2 },
      { icon: '☠️', msg: '一名國民去世', w: 2 },
      { icon: '⚰️', msg: '通報大規模死亡事件', w: 3 },
      { icon: '🏥', msg: '醫療容量擴建完成', w: 1 },
      { icon: '📣', msg: '城市區出生率上升', w: 1 },
      { icon: '🧹', msg: '派系指派清理隊伍', w: 1 },
      { icon: '🦠', msg: '流行病蔓延至兩區', w: 2 },
    ]
  }
};

let lang = localStorage.getItem(LANG_KEY) || 'en';
let state = loadState(true);
let archives = loadArchives();
let currentTab = 'live';

function randomName() {
  const arr = lang === 'zh' ? NAMES_ZH : NAMES_EN;
  let n = arr[Math.floor(Math.random() * arr.length)];
  if (Math.random() < 0.4) n += arr[Math.floor(Math.random() * arr.length)];
  return n;
}
function randInt(n) { return Math.floor(Math.random() * Math.max(1, n)); }

function createAgent(id) {
  return {
    id, name: randomName(), title: null,
    faction: factionIds[randInt(4)],
    age: Math.floor(Math.random() * 40) + 18,
    health: Math.floor(Math.random() * 60) + 40,
    alive: true, isActor: false,
    skills: { business: randInt(100), engineering: randInt(100), negotiation: randInt(100), research: randInt(100) },
    wealth: Math.floor(Math.random() * 5000),
    mood: i18n[lang].moods[randInt(4)],
    lastAction: 'idle', deathDay: null, memory: [], color: null
  };
}

function seedTerritory() {
  const t = Array.from({ length: MAP_SIZE * MAP_SIZE }, () => ({ owner: null, contested: false }));
  factionIds.forEach(id => {
    const owned = randInt(12) + 8;
    for (let i = 0; i < owned; i++) {
      const idx = randInt(t.length);
      t[idx].owner = id;
      t[idx].contested = Math.random() < 0.2;
    }
  });
  return t;
}

function initState() {
  const agents = [];
  for (let i = 0; i < 120; i++) agents.push(createAgent(i));
  return {
    tick: 0, day: 1, hour: 6, minute: 0, nextId: 120,
    resources: { money: 1250000, food: 850000, materials: 670000, energy: 920000, influence: 450000, population: 120 },
    economy: { gdp: 4200000, inflation: 0.02, unemployment: 0.08, marketTrend: 'stable' },
    factions: factionIds.map(id => ({
      id, color: factionColors[id],
      members: agents.filter(a => a.faction === id).length,
      territory: randInt(20) + 10
    })),
    agents, events: [],
    territory: seedTerritory(),
    paused: false, speed: 1
  };
}

function loadState(forceNew = false) {
  if (forceNew) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(ARCHIVE_KEY);
    return initState();
  }
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return initState();
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function loadArchives() {
  try { const raw = localStorage.getItem(ARCHIVE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return [];
}
function saveArchives(archives) {
  try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archives)); } catch(e){}
}

function saveArchive(state) {
  const archive = {
    tick: state.tick, day: state.day, hour: state.hour,
    timestamp: Date.now(),
    resources: { ...state.resources },
    economy: { ...state.economy },
    populations: state.agents.filter(a => a.alive).length,
    deadCount: state.agents.filter(a => !a.alive).length,
    factions: state.factions.map(f => ({ id: f.id, members: f.members, territory: f.territory })),
    territory: state.territory.map(c => ({ owner: c.owner, contested: c.contested })),
    events: state.events.slice(0, 10)
  };
  archives.push(archive);
  if (archives.length > 50) archives = archives.slice(-50);
  saveArchives(archives);
  renderArchives();
}

function resetState() { state = initState(); saveState(state); applyLang(); render(state); renderArchives(); }

// ============================================================
// TICK ENGINE
// ============================================================

function tick(state) {
  if (state.paused) return state;
  const t = i18n[lang];

  state.tick++;
  state.minute += 10;
  if (state.minute >= 60) { state.minute = 0; state.hour++; }
  if (state.hour >= 24) { state.hour = 0; state.day++; }

  // Resources (Article III)
  Object.keys(state.resources).forEach(k => {
    if (k === 'population') return;
    const delta = Math.floor((Math.random() - 0.4) * 800);
    state.resources[k] = Math.max(1000, state.resources[k] + delta);
  });
  state.resources.population = state.agents.filter(a => a.alive).length;

  // Economy (Article IV)
  state.economy.gdp += Math.floor((Math.random() - 0.4) * 500);
  state.economy.inflation += (Math.random() - 0.5) * 0.005;
  state.economy.inflation = Math.max(-0.02, Math.min(0.15, state.economy.inflation));
  const trends = [t.stable, t.growing, t.shrinking, t.volatile];
  if (Math.random() < 0.05) state.economy.marketTrend = trends[randInt(trends.length)];

  // Agents (Article I, VII, VIII)
  state.agents.forEach(agent => {
    if (!agent.alive) return;
    agent.age += (10 / 60) / 24;
    if (Math.random() < 0.01) agent.health -= randInt(7) + 2;
    if (agent.health < 0) agent.health = 0;
    if (Math.random() < 0.3) {
      agent.lastAction = t.actions[randInt(t.actions.length)];
      agent.wealth += Math.floor((Math.random() - 0.4) * 300);
      agent.wealth = Math.max(0, agent.wealth);
      agent.mood = t.moods[randInt(t.moods.length)];
    }
    if (agent.wealth > 3000 && agent.health < 80) agent.health += randInt(4);
    agent.health = Math.min(100, agent.health);
    if (agent.memory.length > 20) agent.memory = agent.memory.slice(-20);
  });

  // Deaths (Article I)
  const newDeaths = [];
  state.agents.forEach(agent => {
    if (!agent.alive) return;
    if (agent.health <= 0 || Math.random() < 0.0005 || agent.age > 80 + Math.random() * 30) {
      agent.alive = false;
      agent.deathDay = state.day;
      const causes = ['illness','accident','old age','disease outbreak','natural causes'];
      newDeaths.push({ agent: agent.name, age: Math.floor(agent.age), cause: causes[randInt(causes.length)] });
    }
  });
  if (newDeaths.length > 0) {
    state.events.unshift({
      tick: state.tick, day: state.day, hour: state.hour,
      icon: '☠️', msg: newDeaths.map(d => `${d.agent} died at ${d.age} (${d.cause})`).join(', '), w: 3
    });
  }

  // Births (Article I)
  const aliveCount = state.agents.filter(a => a.alive).length;
  if (aliveCount < 8 && Math.random() < 0.3) {
    const baby = createAgent(state.nextId++);
    baby.age = 0; baby.health = 100;
    state.events.unshift({ tick: state.tick, day: state.day, hour: state.hour, icon: '👶', msg: `${baby.name} was born into Ashworth`, w: 2 });
    state.agents.push(baby);
  }

  // Mass death (Article I)
  if (Math.random() < 0.003) {
    state.agents.forEach(agent => {
      if (agent.alive && Math.random() < 0.3) { agent.alive = false; agent.deathDay = state.day; }
    });
    state.events.unshift({ tick: state.tick, day: state.day, hour: state.hour, icon: '⚰️', msg: 'Mass mortality event struck Ashworth', w: 4 });
  }

  // Events (Article V)
  if (Math.random() < 0.35) {
    const evt = t.events[randInt(t.events.length)];
    state.events.unshift({ tick: state.tick, day: state.day, hour: state.hour, ...evt });
    if (state.events.length > 50) state.events.pop();
  }

  // Territory (Article VI)
  state.territory.forEach((cell, idx) => {
    if (Math.random() < 0.03) {
      const aliveFactions = factionIds.filter(id => state.agents.some(a => a.alive && a.faction === id));
      if (aliveFactions.length > 0 && Math.random() < 0.15) {
        cell.owner = aliveFactions[randInt(aliveFactions.length)];
        cell.contested = Math.random() < 0.2;
      } else {
        cell.owner = null; cell.contested = false;
      }
    }
  });

  // Update faction stats
  state.factions.forEach(f => {
    f.territory = state.territory.filter(c => c.owner === f.id).length || 1;
    f.members = state.agents.filter(a => a.faction === f.id && a.alive).length || f.members;
  });

  return state;
}

// ============================================================
// RENDER
// ============================================================

function render(state) {
  const t = i18n[lang];
  const hh = String(state.hour).padStart(2, '0');
  const mm = String(state.minute).padStart(2, '0');
  document.getElementById('tickInfo').textContent = t.tickInfo(state.tick, state.day, `${hh}:${mm}`);

  // Resources
  document.getElementById('resourceGrid').innerHTML = Object.entries(state.resources).map(([k, v]) => {
    const label = t.resources[k] || k;
    return `<div class="resource-item"><div class="resource-label">${label}</div><div class="resource-value">${v.toLocaleString()}</div><div class="chart-bar"><div class="chart-fill" style="width:${Math.min(100, (v / 2000000) * 100)}%"></div></div></div>`;
  }).join('');

  // Economy
  document.getElementById('economyInfo').innerHTML = `
    ${t.gdp}: $${state.economy.gdp.toLocaleString()}<br>
    ${t.inflation}: ${(state.economy.inflation * 100).toFixed(1)}%<br>
    ${t.unemployment}: ${(state.economy.unemployment * 100).toFixed(1)}%<br>
    ${t.market}: <b>${state.economy.marketTrend}</b>
  `;

  const alive = state.agents.filter(a => a.alive);
  const avgH = alive.length ? Math.round(alive.reduce((s,a) => s + a.health, 0) / alive.length) : 0;
  const avgW = alive.length ? Math.round(alive.reduce((s,a) => s + a.wealth, 0) / alive.length) : 0;
  document.getElementById('agentStats').innerHTML = `Avg Health: ${avgH}%<br>Avg Wealth: $${avgW.toLocaleString()}<br>Total Dead: ${state.agents.length - alive.length}`;

  // Citizens
  document.getElementById('agentList').innerHTML = alive.slice(0, 60).map(a => `
    <div class="agent-card">
      <div class="agent-name"><span class="status-dot status-alive"></span>${a.name}</div>
      <div class="agent-meta">${t.mood}: ${a.mood} · ${t.wealth}: $${a.wealth.toLocaleString()}</div>
      <div class="agent-meta">${t.age}: ${Math.floor(a.age)} · ${t.health}: ${a.health}</div>
      <div class="chart-bar"><div class="chart-fill" style="width:${a.health}%;background:${a.health>70?'#34d399':a.health>30?'#fbbf24':'#ef4444'}"></div></div>
      <div class="agent-action">→ ${a.lastAction}</div>
    </div>
  `).join('');

  if (alive.length > 60) {
    document.getElementById('agentList').innerHTML += `<div style="color:#64748b;font-size:0.75rem;padding:4px;">...and ${alive.length - 60} more citizens</div>`;
  }

  const dead = state.agents.filter(a => !a.alive);
  if (dead.length > 0) {
    document.getElementById('agentList').innerHTML += '<div style="margin-top:8px;color:#64748b;font-size:0.75rem;">Recently deceased:</div>';
    document.getElementById('agentList').innerHTML += dead.slice(-5).map(a => `
      <div class="agent-card dead">
        <div class="agent-name"><span class="status-dot status-dead"></span>${a.name} <span class="badge">${t.dead}</span></div>
        <div class="agent-meta">${t.age}: ${Math.floor(a.age)} · Died Day ${a.deathDay}</div>
      </div>
    `).join('');
  }

  // Events
  document.getElementById('eventLog').innerHTML = (currentTab === 'live' ? state.events : []).slice(0, 20).map(e => {
    const hh = String(e.hour).padStart(2, '0');
    return `<div class="event-item"><span class="event-time">Day ${e.day} ${hh}:00</span> <span class="event-type">${e.icon}</span> ${e.msg}</div>`;
  }).join('') || '<div style="color:#64748b;font-size:0.75rem;padding:8px;">No events yet</div>';

  // Population label
  document.getElementById('popLabel').innerHTML = `👥 ${alive.length}`;
  if (dead.length > 0) document.getElementById('popLabel').innerHTML += ` <span style="color:#ef4444">☠️${dead.length}</span>`;

  renderArchives();
  drawTerritoryMap(state);
}

// ============================================================
// MAP
// ============================================================

function drawTerritoryMap(state) {
  const canvas = document.getElementById('mapCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const rect = canvas.getBoundingClientRect();
  const displayW = (rect.width && rect.width > 0) ? rect.width : 800;
  const displayH = (rect.height && rect.height > 0) ? rect.height : 450;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = displayW * dpr;
  canvas.height = displayH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cellW = displayW / MAP_SIZE;
  const cellH = displayH / MAP_SIZE;
  const padX = cellW * 0.12;
  const padY = cellH * 0.15;

  ctx.clearRect(0, 0, displayW, displayH);

  // Background ground
  ctx.fillStyle = '#f5f0e6';
  ctx.fillRect(0, 0, displayW, displayH);
  // subtle texture dots
  ctx.fillStyle = '#ebe5d5';
  for (let i = 0; i < 200; i++) {
    const gx = Math.random() * displayW;
    const gy = Math.random() * displayH;
    ctx.fillRect(gx, gy, 2, 2);
  }

  // Roads: horizontal + vertical grid with margins
  ctx.fillStyle = '#94a3b8';
  const roadH = cellH * 0.18;
  const roadV = cellW * 0.18;
  for (let i = 0; i <= MAP_SIZE; i++) {
    const yy = i * cellH - roadH / 2;
    ctx.fillRect(0, yy, displayW, roadH);
    const xx = i * cellW - roadV / 2;
    ctx.fillRect(xx, 0, roadV, displayH);
  }
  // lane markings
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  for (let i = 0; i <= MAP_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * cellH);
    ctx.lineTo(displayW, i * cellH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(i * cellW, 0);
    ctx.lineTo(i * cellW, displayH);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Zone content: buildings, trees, water
  const seed = (state.tick % 100) + state.day;
  function pseudoRand(x, y) { return ((Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453) % 1 + 1) % 1; }

  state.territory.forEach((cell, idx) => {
    const x = idx % MAP_SIZE;
    const y = Math.floor(idx / MAP_SIZE);
    const cx = x * cellW + cellW / 2;
    const cy = y * cellH + cellH / 2;
    const rx = cellW / 2 - padX;
    const ry = cellH / 2 - padY;
    const owner = cell.owner;

    // Water feature (river/canal) through some neutral zones
    if (!owner && pseudoRand(x, y) > 0.82) {
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(x * cellW + padX, y * cellH + padY, cellW - padX * 2, cellH - padY * 2);
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.moveTo(x * cellW + padX + 4, y * cellH + cellH / 2);
      ctx.quadraticCurveTo(cx, cy - 4, x * cellW + cellW - padX - 4, y * cellH + cellH / 2);
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3;
      ctx.stroke();
      return;
    }

    // Building(s)
    const bCount = pseudoRand(x + 1, y + 1) > 0.7 ? 2 : 1;
    for (let b = 0; b < bCount; b++) {
      const bx = cx - rx / 2 + (b === 0 ? -rx * 0.2 : rx * 0.2);
      const by = cy - ry / 2;
      const bw = rx * (bCount === 1 ? 0.85 : 0.7);
      const bh = ry * (bCount === 1 ? 0.7 : 0.55);
      // wall
      const wallColors = ['#e2e8f0', '#cbd5e1', '#f1f5f9', '#e2e8f0'];
      ctx.fillStyle = wallColors[Math.floor(pseudoRand(x + b, y) * wallColors.length)];
      ctx.fillRect(bx - bw / 2, by - bh / 2, bw, bh);
      // roof
      const roofHues = owner ? factionColors[owner] : '#64748b';
      ctx.fillStyle = roofHues;
      ctx.fillRect(bx - bw / 2 - 2, by - bh / 2 - 4, bw + 4, 6);
      // windows
      ctx.fillStyle = '#fbbf24';
      const wSize = Math.max(2, bw * 0.12);
      for (let wx = bx - bw / 2 + 3; wx < bx + bw / 2 - 3; wx += bw * 0.28) {
        for (let wy = by - bh / 2 + 3; wy < by + bh / 2 - 3; wy += bh * 0.35) {
          ctx.fillRect(wx, wy, wSize, wSize);
        }
      }
    }

    // Trees
    if (pseudoRand(x + 2, y + 2) > 0.55) {
      const tx = x * cellW + padX + pseudoRand(x, y) * (cellW - padX * 2);
      const ty = y * cellH + padY + pseudoRand(x + 1, y + 1) * (cellH - padY * 2);
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(tx, ty, Math.max(4, cellW * 0.12), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.arc(tx - 1, ty - 1, Math.max(3, cellW * 0.08), 0, Math.PI * 2);
      ctx.fill();
    }

    // Vehicles (moving dots on roads)
    if (pseudoRand(x + 3, y + 3) > 0.65) {
      const vx = x * cellW + cellW * 0.5 + pseudoRand(x + 4, y) * cellW * 0.4;
      const vy = y * cellH + cellH * 0.5 + pseudoRand(x, y + 4) * cellH * 0.4;
      ctx.fillStyle = ['#ef4444', '#f59e0b', '#ffffff', '#1e293b'][Math.floor(pseudoRand(x + 5, y + 5) * 4)];
      ctx.fillRect(vx - 2, vy - 1, 4, 2);
    }

    // Faction overlay tint when owned
    if (owner) {
      ctx.fillStyle = (factionColors[owner] || '#475569') + '22';
      ctx.fillRect(x * cellW + padX, y * cellH + padY, cellW - padX * 2, cellH - padY * 2);
      if (cell.contested) {
        ctx.fillStyle = 'rgba(245, 158, 11, 0.25)';
        ctx.fillRect(x * cellW + padX, y * cellH + padY, cellW - padX * 2, cellH - padY * 2);
      }
      // small flag
      ctx.fillStyle = factionColors[owner] || '#475569';
      ctx.fillRect(x * cellW + cellW - padX - 6, y * cellH + padY + 2, 5, 5);
    }
  });

  // Tooltip
  const tooltip = document.getElementById('tooltip');
  canvas.onmousemove = (evt) => {
    const r = canvas.getBoundingClientRect();
    const mx = evt.clientX - r.left;
    const my = evt.clientY - r.top;
    const zx = Math.floor(mx / (r.width / MAP_SIZE));
    const zy = Math.floor(my / (r.height / MAP_SIZE));
    const idx = zy * MAP_SIZE + zx;
    if (idx >= 0 && idx < state.territory.length) {
      const cell = state.territory[idx];
      const ownerName = cell.owner ? (factionNames_EN[cell.owner] || cell.owner) : 'Neutral';
      tooltip.style.display = 'block';
      tooltip.style.left = (evt.clientX + 10) + 'px';
      tooltip.style.top = (evt.clientY - 20) + 'px';
      tooltip.textContent = `Zone [${zx},${zy}] — ${ownerName}${cell.contested ? ' (contested)' : ''}`;
    }
  };
  canvas.onmouseleave = () => { tooltip.style.display = 'none'; };

  canvas.onclick = (evt) => {
    const r = canvas.getBoundingClientRect();
    const mx = evt.clientX - r.left;
    const my = evt.clientY - r.top;
    const zx = Math.floor(mx / (r.width / MAP_SIZE));
    const zy = Math.floor(my / (r.height / MAP_SIZE));
    const idx = zy * MAP_SIZE + zx;
    if (idx >= 0 && idx < state.territory.length) {
      if (state.territory[idx].owner) {
        state.territory[idx].owner = null;
        state.territory[idx].contested = false;
      } else {
        const aliveFactions = factionIds.filter(id => state.agents.some(a => a.alive && a.faction === id));
        if (aliveFactions.length > 0) {
          state.territory[idx].owner = aliveFactions[randInt(aliveFactions.length)];
          state.territory[idx].contested = Math.random() < 0.3;
        }
      }
      saveState(state); render(state);
    }
  };

  // Legend
  document.getElementById('mapLegend').innerHTML =
    factionIds.map(id => `<div class="map-legend-item"><div class="map-legend-color" style="background:${factionColors[id]}"></div><span>${factionNames_EN[id] || id}</span></div>`).join('') +
    `<div class="map-legend-item"><div class="map-legend-color" style="background:#60a5fa"></div><span>Neutral / Water</span></div>` +
    `<div class="map-legend-item"><div class="map-legend-color" style="background:linear-gradient(135deg,#ef4444,#f59e0b)"></div><span>Contested</span></div>`;
}

// ============================================================
// ARCHIVES
// ============================================================

function renderArchives() {
  const el = document.getElementById('archiveTimeline');
  if (!el) return;
  el.innerHTML = archives.map((arc, i) => {
    const hh = String(arc.hour).padStart(2, '0');
    return `<div class="archive-dot ${i === archives.length - 1 ? 'current' : 'has-data'}" title="Day ${arc.day} ${hh}:00 — T${arc.tick}" onclick="viewArchiveIndex(${i})"></div>`;
  }).join('');
}

window.viewArchiveIndex = function(i) {
  const arc = archives[i];
  if (!arc) return;
  const display = document.getElementById('eventDisplay');
  display.innerHTML = `
    <div style="font-size:0.8rem;color:#fbbf24;margin-bottom:6px;">📜 Day ${arc.day} Tick ${arc.tick} (${new Date(arc.timestamp).toLocaleTimeString()})</div>
    <div style="font-size:0.75rem;color:#94a3b8;margin-bottom:4px;">Population: ${arc.populations} | Dead: ${arc.deadCount} | GDP: $${arc.economy.gdp.toLocaleString()}</div>
    <div style="font-size:0.75rem;color:#94a3b8;">Factions: ${arc.factions.map(f => `${factionNames_EN[f.id]||f.id}(${f.members}/${f.territory})`).join(', ')}</div>
    <div style="margin-top:6px;">${arc.events.map(e => `<div class="past-event-item">${e.icon} ${e.msg}</div>`).join('')}</div>
  `;
};

// ============================================================
// CONTROLS
// ============================================================

const speedBtn = document.getElementById('speedBtn');
const speeds = [1, 2, 5, 10];
let speedIdx = 0;

speedBtn.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  state.speed = speeds[speedIdx];
  applyLang();
});
document.getElementById('eventBtn').addEventListener('click', () => {
  const t = i18n[lang];
  const evt = t.events[randInt(t.events.length)];
  state.events.unshift({ tick: state.tick, day: state.day, hour: state.hour, ...evt });
  saveState(state); render(state);
});
document.getElementById('langEn').addEventListener('click', () => { lang = 'en'; localStorage.setItem(LANG_KEY, lang); applyLang(); render(state); });
document.getElementById('langZh').addEventListener('click', () => { lang = 'zh'; localStorage.setItem(LANG_KEY, lang); applyLang(); render(state); });
document.getElementById('tabLive').addEventListener('click', () => { currentTab = 'live'; document.getElementById('tabLive').classList.add('active'); document.getElementById('tabPast').classList.remove('active'); render(state); });
document.getElementById('tabPast').addEventListener('click', () => { currentTab = 'past'; document.getElementById('tabPast').classList.add('active'); document.getElementById('tabLive').classList.remove('active'); render(state); });

setInterval(() => {
  for (let i = 0; i < state.speed; i++) { state = tick(state); saveState(state); }
  render(state);
}, 10000);

function applyLang() {
  const t = i18n[lang];
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('facTitle').textContent = t.facTitle;
  document.getElementById('resTitle').textContent = t.resTitle;
  document.getElementById('ecoTitle').textContent = t.ecoTitle;
  document.getElementById('agtTitle').textContent = t.agtTitle;
  document.getElementById('evtTitle').textContent = t.evtTitle;
  document.getElementById('archiveTitle').textContent = t.archiveTitle;
  speedBtn.textContent = t.speed(state.speed);
  document.getElementById('autoLabel').textContent = t.autoLabel;
  document.getElementById('eventBtn').textContent = t.trigger;
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.getElementById('langZh').classList.toggle('active', lang === 'zh');
}

applyLang();
render(state);
</script>
