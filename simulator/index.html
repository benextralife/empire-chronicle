<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Kingdom of Ashworth — Live Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #1e293b, #334155);
  padding: 16px 24px;
  border-bottom: 2px solid #475569;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
header h1 { font-size: 1.4rem; color: #60a5fa; }
.tick-info { font-size: 0.85rem; color: #94a3b8; }
.lang-btn {
  background: #334155;
  border: 1px solid #475569;
  color: #e2e8f0;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
}
.lang-btn:hover { background: #475569; transform: translateY(-1px); }
.lang-btn.active { background: #2563eb; border-color: #3b82f6; }
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  padding: 16px;
  max-width: 1400px;
  margin: 0 auto;
}
@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; }
}
.panel {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 14px;
}
.panel h2 {
  font-size: 1rem;
  color: #60a5fa;
  margin-bottom: 10px;
  border-bottom: 1px solid #334155;
  padding-bottom: 6px;
}
.agent-card {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 0.82rem;
  transition: transform 0.1s;
}
.agent-card:hover { transform: translateX(3px); border-color: #475569; }
.agent-card.dead { opacity: 0.5; border-style: dashed; }
.agent-name { font-weight: bold; color: #fbbf24; }
.agent-meta { color: #94a3b8; font-size: 0.75rem; }
.agent-action { color: #a5b4fc; margin-top: 2px; font-size: 0.78rem; }
.event-log {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 8px 10px;
  max-height: 380px;
  overflow-y: auto;
  font-size: 0.78rem;
}
.event-item { padding: 5px 0; border-bottom: 1px solid #1e293b; }
.event-item:last-child { border-bottom: none; }
.event-time { color: #64748b; }
.event-type { color: #fbbf24; }
.resource-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.resource-item {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 0.78rem;
  transition: background 0.3s;
}
.resource-value { font-size: 1.1rem; font-weight: bold; color: #34d399; }
.faction-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.faction-tag {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 0.75rem;
}
.faction-name { color: #fbbf24; }
.faction-count { color: #64748b; }

.controls {
  padding: 8px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto;
  flex-wrap: wrap;
}
.btn {
  background: #334155;
  border: 1px solid #475569;
  color: #e2e8f0;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: all 0.15s;
  user-select: none;
}
.btn:hover { background: #475569; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.active { background: #2563eb; border-color: #3b82f6; }
.badge {
  background: #ef4444;
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7rem;
  margin-left: 6px;
}

/* Territory map */
.territory-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
  margin-top: 8px;
}
.territory-cell {
  aspect-ratio: 1;
  border-radius: 3px;
  background: #0f172a;
  border: 1px solid #1e293b;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.territory-cell:hover { transform: scale(1.1); z-index: 2; }
.territory-cell.gov { background: #3b82f6; border-color: #60a5fa; }
.territory-cell.corp { background: #10b981; border-color: #34d399; }
.territory-cell.research { background: #8b5cf6; border-color: #a78bfa; }
.territory-cell.black { background: #ef4444; border-color: #f87171; }
.territory-cell.conflict { background: linear-gradient(135deg, #ef4444, #f59e0b); animation: pulse 1.5s infinite; }
.territory-cell.war { background: #7f1d1d; animation: pulse 0.8s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.map-legend {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 0.7rem;
  margin-top: 6px;
}
.map-legend-item { display: flex; align-items: center; gap: 3px; }
.map-legend-color { width: 10px; height: 10px; border-radius: 2px; }

/* Chart bars */
.chart-bar {
  height: 6px;
  background: #334155;
  border-radius: 3px;
  overflow: hidden;
  margin-top: 3px;
}
.chart-fill {
  height: 100%;
  background: #34d399;
  border-radius: 3px;
  transition: width 0.5s;
}

/* Agent status indicators */
.status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 4px;
}
.status-alive { background: #34d399; }
.status-dead { background: #ef4444; }

/* Tooltip */
.tooltip {
  position: fixed;
  background: #1e293b;
  border: 1px solid #475569;
  color: #e2e8f0;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  pointer-events: none;
  z-index: 100;
  display: none;
}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="pageTitle">🤖 Kingdom of Ashworth — Live Simulator</h1>
    <span class="tick-info" id="tickInfo">Tick: 0 | Day 1 | 06:00</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="lang-btn active" id="langEn">EN</button>
    <button class="lang-btn" id="langZh">中文</button>
  </div>
</header>

<div class="controls">
  <button class="btn" id="pauseBtn">⏸ Pause</button>
  <button class="btn" id="speedBtn">⚡ Speed: 1x</button>
  <button class="btn" id="eventBtn">📜 Trigger Event</button>
  <button class="btn" id="resetBtn">🔄 Reset World</button>
  <span style="color:#64748b;font-size:0.8rem;margin-left:8px;" id="autoLabel">Auto-evolve every 10s</span>
  <span style="color:#64748b;font-size:0.8rem;" id="popLabel">👥 15</span>
</div>

<div class="main-grid">
  <div class="panel">
    <h2 id="resTitle">💰 Resources</h2>
    <div class="resource-grid" id="resourceGrid"></div>
  </div>

  <div class="panel">
    <h2 id="facTitle">🏛 Factions</h2>
    <div class="faction-bar" id="factionBar"></div>
    <div style="margin-top:10px;">
      <div style="font-size:0.75rem;color:#94a3b8;margin-bottom:4px;" id="mapTitle">Territory Map (click cell)</div>
      <div class="territory-grid" id="territoryMap"></div>
      <div class="map-legend" id="mapLegend"></div>
    </div>
  </div>

  <div class="panel">
    <h2 id="ecoTitle">📈 Economy</h2>
    <div id="economyInfo" style="font-size:0.8rem;color:#94a3b8;"></div>
    <div style="margin-top:8px;" id="agentStats"></div>
  </div>

  <div class="panel" style="grid-column: span 2;">
    <h2 id="agtTitle">👥 Citizens</h2>
    <div id="agentList"></div>
  </div>

  <div class="panel">
    <h2 id="evtTitle">📜 Event Log</h2>
    <div class="event-log" id="eventLog"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

    },

    dead: '已故',
    healthBar: '健康',
    war: '戰爭',

    contested: '爭奪中',
    legend: ['王室','商會','學院','暗市','中立','戰爭'],
  }

let lang = localStorage.getItem(LANG_KEY) || 'en';
let state = loadState();

const NAMES_EN = ['Aria','Bolt','Cipher','Drift','Echo','Flux','Glitch','Haven','Ion','Jade','Kai','Lumen','Mist','Nexus','Oracle','Pixel','Quill','Riven','Spark','Tide','Umbra','Vex','Wisp','Xen','Yield','Zen'];
const NAMES_ZH = ['雲','風','影','星','河','光','塵','焰','雷','玲','霄','辰','瑤','墨','楓','月','白','夜','竹','霜'];
const factionIds = ['gov','corp','research','black'];
const factionColors = { gov: '#3b82f6', corp: '#10b981', research: '#8b5cf6', black: '#ef4444' };

function randomName() {
  return lang === 'zh'
    ? NAMES_ZH[Math.floor(Math.random() * NAMES_ZH.length)] + NAMES_ZH[Math.floor(Math.random() * NAMES_ZH.length)]
    : NAMES_EN[Math.floor(Math.random() * NAMES_EN.length)];
}

function createAgent(id) {
  const a = randomName();
  const suffix = id > 26 ? `-${id}` : '';
  return {
    id, name: a + suffix,
    faction: factionIds[Math.floor(Math.random() * factionIds.length)],
    age: Math.floor(Math.random() * 40) + 18,
    health: Math.floor(Math.random() * 60) + 40,
    alive: true,
    skills: {
      business: Math.floor(Math.random() * 100),
      engineering: Math.floor(Math.random() * 100),
      negotiation: Math.floor(Math.random() * 100),
      research: Math.floor(Math.random() * 100),
    },
    wealth: Math.floor(Math.random() * 5000),
    mood: ['happy','neutral','anxious','focused'][Math.floor(Math.random() * 4)],
    lastAction: 'idle',
    deathDay: null,
  };
}

function initState() {
  const agents = [];
  for (let i = 0; i < 15; i++) agents.push(createAgent(i));
  return {
    tick: 0, day: 1, hour: 6, minute: 0, nextId: 15,
    resources: { money: 125000, food: 85000, materials: 67000, energy: 92000, influence: 45000, population: 15 },
    economy: { gdp: 420000, inflation: 0.02, unemployment: 0.08, marketTrend: 'stable' },
    factions: factionIds.map((id, idx) => ({
      id, name: id, color: factionColors[id],
      members: agents.filter(a => a.faction === id).length,
      territory: Math.floor(Math.random() * 30) + 10,
    })),
    agents,
    events: [],
    territory: Array.from({ length: MAP_SIZE }, () => ({ owner: null, contested: false })),
    paused: false,
    speed: 1,
  };
}

function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return initState();
}
function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function resetState() {
  localStorage.removeItem(STORAGE_KEY);
  state = initState();
  applyLang();
  render(state);
}

function tick(state) {
  if (state.paused) return state;
  const t = i18n[lang];

  state.tick++;
  state.minute += 10;
  if (state.minute >= 60) { state.minute = 0; state.hour++; }
  if (state.hour >= 24) { state.hour = 0; state.day++; }

  // Resources
  Object.keys(state.resources).forEach(k => {
    const delta = Math.floor((Math.random() - 0.45) * 800);
    state.resources[k] = Math.max(1000, state.resources[k] + delta);
  });
  state.resources.population = state.agents.filter(a => a.alive).length;

  // Economy
  state.economy.gdp += Math.floor((Math.random() - 0.4) * 500);
  state.economy.inflation += (Math.random() - 0.5) * 0.005;
  state.economy.inflation = Math.max(-0.02, Math.min(0.15, state.economy.inflation));
  const trends = [t.stable, t.growing, t.shrinking, t.volatile];
  if (Math.random() < 0.05) state.economy.marketTrend = trends[Math.floor(Math.random() * trends.length)];

  // Agents age/health/action
  state.agents.forEach(agent => {
    if (!agent.alive) return;
    agent.age += (10 / 60) / 24;
    if (Math.random() < 0.01) agent.health -= Math.floor(Math.random() * 8 + 2);
    if (agent.health < 0) agent.health = 0;
    if (Math.random() < 0.3) {
      agent.lastAction = t.actions[Math.floor(Math.random() * t.actions.length)];
      agent.wealth += Math.floor((Math.random() - 0.4) * 300);
      agent.wealth = Math.max(0, agent.wealth);
      agent.mood = t.moods[Math.floor(Math.random() * t.moods.length)];
    }
  });

  // Wealthy heal
  state.agents.forEach(agent => {
    if (!agent.alive) return;
    if (agent.wealth > 3000 && agent.health < 80) agent.health += Math.floor(Math.random() * 4);
    agent.health = Math.min(100, agent.health);
  });

  // Deaths
  state.agents.forEach(agent => {
    if (!agent.alive) return;
    if (agent.health <= 0 || Math.random() < 0.0005 || agent.age > 80 + Math.random() * 30) {
      agent.alive = false;
      agent.deathDay = state.day;
      const causes = ['illness','accident','old age','disease outbreak','natural causes'];
      const cause = causes[Math.floor(Math.random() * causes.length)];
      state.events.unshift({
        tick: state.tick, day: state.day, hour: state.hour,
        icon: '☠️', msg: `${agent.name} died at age ${Math.floor(agent.age)} (${cause})`, w: 3
      });
    }
  });

  // Births
  const aliveCount = state.agents.filter(a => a.alive).length;
  if (aliveCount < 8 && Math.random() < 0.3) {
    const baby = createAgent(state.nextId++);
    baby.age = 0; baby.health = 100;
    state.events.unshift({
      tick: state.tick, day: state.day, hour: state.hour,
      icon: '👶', msg: `${baby.name} was born into Ashworth`, w: 2
    });
    state.agents.push(baby);
  }

  // Mass death
  if (Math.random() < 0.003) {
    state.agents.forEach(agent => {
      if (agent.alive && Math.random() < 0.3) { agent.alive = false; agent.deathDay = state.day; }
    });
    state.events.unshift({
      tick: state.tick, day: state.day, hour: state.hour,
      icon: '⚰️', msg: 'Mass mortality event struck Ashworth', w: 4
    });
  }

  // Random events
  if (Math.random() < 0.35) {
    const evt = t.events[Math.floor(Math.random() * t.events.length)];
    state.events.unshift({ tick: state.tick, day: state.day, hour: state.hour, ...evt });
    if (state.events.length > 50) state.events.pop();
  }

  // Territory changes (8x8 grid)
  state.territory.forEach((cell, idx) => {
    if (Math.random() < 0.03) {
      const aliveFactions = factionIds.filter(id => state.agents.some(a => a.alive && a.faction === id));
      if (aliveFactions.length > 0 && Math.random() < 0.15) {
        cell.owner = aliveFactions[Math.floor(Math.random() * aliveFactions.length)];
        cell.contested = Math.random() < 0.2;
      } else {
        cell.owner = null;
        cell.contested = false;
      }
    }
  });

  // Faction territory count
  state.factions.forEach(f => {
    f.territory = state.territory.filter(c => c.owner === f.id).length || 1;
    f.members = state.agents.filter(a => a.faction === f.id && a.alive).length || f.members;
  });

  state.resources.population = state.agents.filter(a => a.alive).length;
  return state;
}

function render(state) {
  const t = i18n[lang];
  const hh = String(state.hour).padStart(2, '0');
  const mm = String(state.minute).padStart(2, '0');
  document.getElementById('tickInfo').textContent = t.tickInfo(state.tick, state.day, `${hh}:${mm}`);

  // Resources
  document.getElementById('resourceGrid').innerHTML = Object.entries(state.resources).map(([k, v]) => {
    const label = t.resources[k] || k;
    const prev = state._prevRes ? state._prevRes[k] : v;
    const delta = v - prev;
    const arrow = delta > 0 ? ' ↑' : delta < 0 ? ' ↓' : '';
    return `<div class="resource-item"><div class="resource-label">${label}</div><div class="resource-value">${v.toLocaleString()}${arrow}</div><div class="chart-bar"><div class="chart-fill" style="width:${Math.min(100, (v / 200000) * 100)}%"></div></div></div>`;
  }).join('');
  state._prevRes = { ...state.resources };

  // Factions
  document.getElementById('factionBar').innerHTML = state.factions.map(f => {
    const name = t[f.id] || f.id;
    return `<div class="faction-tag"><span class="faction-name" style="color:${f.color}">${name}</span> <span class="faction-count">${f.members} ${t.agents} · ${f.territory} ${t.zones}</span></div>`;
  }).join('');

  // Economy
  document.getElementById('economyInfo').innerHTML = `
    ${t.gdp}: $${state.economy.gdp.toLocaleString()}<br>
    ${t.inflation}: ${(state.economy.inflation * 100).toFixed(1)}%<br>
    ${t.unemployment}: ${(state.economy.unemployment * 100).toFixed(1)}%<br>
    ${t.market}: <b>${state.economy.marketTrend}</b>
  `;

  // Agent stats
  const alive = state.agents.filter(a => a.alive);
  const avgHealth = alive.length ? Math.round(alive.reduce((s, a) => s + a.health, 0) / alive.length) : 0;
  const avgWealth = alive.length ? Math.round(alive.reduce((s, a) => s + a.wealth, 0) / alive.length) : 0;
  document.getElementById('agentStats').innerHTML = `
    <div style="font-size:0.78rem;color:#94a3b8;">
      Avg Health: ${avgHealth}%<br>
      Avg Wealth: $${avgWealth.toLocaleString()}<br>
      Total Dead: ${state.agents.filter(a => !a.alive).length}
    </div>
  `;

  // Agents
  const aliveAgents = state.agents.filter(a => a.alive);
  const deadAgents = state.agents.filter(a => !a.alive);
  document.getElementById('agentList').innerHTML =
    aliveAgents.map(a => `
      <div class="agent-card">
        <div class="agent-name"><span class="status-dot status-alive"></span>${a.name}</div>
        <div class="agent-meta">${t.mood}: ${a.mood} · ${t.wealth}: $${a.wealth.toLocaleString()}</div>
        <div class="agent-meta">${t.age}: ${Math.floor(a.age)} · ${t.health}: ${a.health}</div>
        <div class="chart-bar"><div class="chart-fill" style="width:${a.health}%;background:${a.health > 70 ? '#34d399' : a.health > 30 ? '#fbbf24' : '#ef4444'}"></div></div>
        <div class="agent-action">→ ${a.lastAction}</div>
      </div>
    `).join('') +
    deadAgents.slice(-5).map(a => `
      <div class="agent-card dead">
        <div class="agent-name"><span class="status-dot status-dead"></span>${a.name} <span class="badge">${t.dead}</span></div>
        <div class="agent-meta">${t.age}: ${Math.floor(a.age)} · Died Day ${a.deathDay}</div>
      </div>
    `).join('');

  // Events
  document.getElementById('eventLog').innerHTML = state.events.slice(0, 20).map(e => {
    const hh = String(e.hour).padStart(2, '0');
    return `<div class="event-item"><span class="event-time">Day ${e.day} ${hh}:00</span> <span class="event-type">${e.icon}</span> ${e.msg}</div>`;
  }).join('');

  // Population label
  const popEl = document.getElementById('popLabel');
  const deathList = deadAgents.slice(-3).map(a => a.name).join(', ');
  popEl.innerHTML = `👥 ${aliveAgents.length}`;
  if (deadAgents.length > 0) popEl.innerHTML += ` <span style="color:#ef4444">☠️${deadAgents.length}</span>`;
  if (deathList) popEl.innerHTML += `<br><span style="color:#64748b;font-size:0.7rem;">RIP: ${deathList}</span>`;

  // Territory map
  renderTerritoryMap(state);
}

function renderTerritoryMap(state) {
  const t = i18n[lang];
  const mapEl = document.getElementById('territoryMap');
  mapEl.innerHTML = state.territory.map((cell, idx) => {
    const x = idx % 8;
    const y = Math.floor(idx / 8);
    let cls = 'territory-cell';
    if (cell.contested) cls += ' conflict';
    else if (cell.owner) cls += ` ${cell.owner}`;
    const tooltipText = t.tooltip({ x, y, owner: cell.owner ? t[cell.owner] || cell.owner : t.neutral });
    return `<div class="${cls}" data-idx="${idx}" data-x="${x}" data-y="${y}" title="${tooltipText}"></div>`;
  }).join('');

  // Legend
  document.getElementById('mapLegend').innerHTML =
    factionIds.map(id => `<div class="map-legend-item"><div class="map-legend-color" style="background:${factionColors[id]}"></div><span>${t[id] || id}</span></div>`).join('') +
    `<div class="map-legend-item"><div class="map-legend-color" style="background:linear-gradient(135deg,#ef4444,#f59e0b)"></div><span>${t.contested}</span></div>` +
    `<div class="map-legend-item"><div class="map-legend-color" style="background:#0f172a;border:1px solid #334155"></div><span>${t.neutral}</span></div>`;

  // Click handler
  mapEl.querySelectorAll('.territory-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const idx = parseInt(cell.dataset.idx);
      if (state.territory[idx].owner) {
        state.territory[idx].owner = null;
        state.territory[idx].contested = false;
      } else {
        const aliveFactions = factionIds.filter(id => state.agents.some(a => a.alive && a.faction === id));
        if (aliveFactions.length > 0) {
          state.territory[idx].owner = aliveFactions[Math.floor(Math.random() * aliveFactions.length)];
          state.territory[idx].contested = Math.random() < 0.3;
        }
      }
      saveState(state);
      renderTerritoryMap(state);
    });
  });
}

let state = loadState();
const pauseBtn = document.getElementById('pauseBtn');
const speedBtn = document.getElementById('speedBtn');
const speeds = [1, 2, 5, 10];
let speedIdx = 0;

function loop() { state = tick(state); saveState(state); render(state); }

pauseBtn.addEventListener('click', () => { state.paused = !state.paused; applyLang(); });
speedBtn.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  state.speed = speeds[speedIdx];
  applyLang();
});
document.getElementById('eventBtn').addEventListener('click', () => {
  const t = i18n[lang];
  const evt = t.events[Math.floor(Math.random() * t.events.length)];
  state.events.unshift({ tick: state.tick, day: state.day, hour: state.hour, ...evt });
  saveState(state);
  render(state);
});
document.getElementById('resetBtn').addEventListener('click', resetState);
document.getElementById('langEn').addEventListener('click', () => { lang = 'en'; localStorage.setItem(LANG_KEY, lang); applyLang(); render(state); });
document.getElementById('langZh').addEventListener('click', () => { lang = 'zh'; localStorage.setItem(LANG_KEY, lang); applyLang(); render(state); });

setInterval(() => { for (let i = 0; i < state.speed; i++) { state = tick(state); saveState(state); } render(state); }, 10000);

function applyLang() {
  const t = i18n[lang];
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('resTitle').textContent = t.resTitle;
  document.getElementById('facTitle').textContent = t.facTitle;
  document.getElementById('ecoTitle').textContent = t.ecoTitle;
  document.getElementById('agtTitle').textContent = t.agtTitle;
  document.getElementById('evtTitle').textContent = t.evtTitle;
  pauseBtn.textContent = state.paused ? t.resume : t.pause;
  speedBtn.textContent = t.speed(state.speed);
  document.getElementById('autoLabel').textContent = t.autoLabel;
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.getElementById('langZh').classList.toggle('active', lang === 'zh');
  const triggerBtn = document.getElementById('eventBtn');
  if (triggerBtn) triggerBtn.textContent = t.trigger;
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.textContent = t.reset;
}

applyLang();
render(state);
</script>
</body>
</html>
