<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📜 王國日報總目錄</title>
<style>
  body {
    font-family: "Noto Serif TC", "Songti TC", serif;
    background: #f5e6d3;
    color: #2b2318;
    margin: 0;
    padding: 0;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  header {
    border: 2px solid #cbb896;
    border-radius: 4px 4px 24px 4px;
    background: rgba(255,255,255,0.6);
    padding: 36px;
    margin-bottom: 32px;
    text-align: center;
  }
  h1 {
    font-size: 1.8rem;
    color: #7a1f1f;
    margin: 0 0 8px;
  }
  .subtitle {
    color: #5a3a1f;
    font-size: 0.95rem;
    letter-spacing: 0.2em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 18px;
  }
  .grid a {
    display: block;
    background: rgba(255,255,255,0.75);
    border: 1.5px solid #cbb896;
    border-radius: 4px 4px 14px 4px;
    padding: 12px 14px;
    color: #7a1f1f;
    text-decoration: none;
    text-align: center;
    font-weight: 600;
  }
  .grid a:hover {
    background: rgba(255,255,255,0.95);
    border-color: #7a1f1f;
  }
  .meta {
    text-align: center;
    color: #5a3a1f;
    font-size: 0.9rem;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📜 王國日報</h1>
    <p class="subtitle">王國存亡，實錄於此</p>
  </header>

  <div class="grid" id="toc"></div>

  <p class="meta">
    共收錄 <span id="cnt">0</span> 期日報 · 起始：2025-06-27
  </p>
</div>

<script>
(function(){
  const start = new Date(Date.UTC(2025, 5, 27));
  const end = new Date(Date.UTC(2026, 6, 10));
  const out = [];
  for(let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate()+1)){
    const iso = d.toISOString().slice(0,10);
    out.push('<a href="/empire-chronicle/daily/' + iso + '.html">' + iso + '</a>');
  }
  document.getElementById('toc').innerHTML = out.join('');
  document.getElementById('cnt').textContent = out.length;
})();
</script>
</body>
</html>
